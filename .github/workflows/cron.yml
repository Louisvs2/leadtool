name: Dispatch loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/process
        run: |
          curl -sf -X POST "${APP_URL}/api/cron/process" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
