name: Dispatch loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/process
        run: |
          # Strip a trailing slash from APP_URL — otherwise this becomes
          # "...vercel.app//api/cron/process" (double slash), Vercel 308s
          # it to the single-slash form, and curl (no -L here) silently
          # "succeeds" against the redirect response instead of the real
          # endpoint, so nothing actually gets dispatched.
          APP_URL="${APP_URL%/}"
          response=$(curl -s -w '\n%{http_code}' -X POST "${APP_URL}/api/cron/process" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "::error::Request failed with status $status"
            exit 1
          fi
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
